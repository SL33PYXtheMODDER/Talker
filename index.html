<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<style>
:root{--bg:#f1f5f4;--side:#e3ebea;--panel:#d6e1df;--text:#142326;--mute:#53686b;--accent:#0f766e;--on:#fff;--hover:#cfdcda;--green:#1f9d55;--red:#d6454b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#142a2d;--side:#0f2124;--panel:#0a181a;--text:#e8f1ef;--mute:#8fa8aa;--accent:#ffcf4a;--on:#1a1a10;--hover:#1d3a3e;--green:#3ddc84;--red:#ff6b70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#142a2d;--side:#0f2124;--panel:#0a181a;--text:#e8f1ef;--mute:#8fa8aa;--accent:#ffcf4a;--on:#1a1a10;--hover:#1d3a3e;--green:#3ddc84;--red:#ff6b70;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:transparent;color:var(--text);padding:7px 11px}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--text);background:var(--panel);border:0;border-radius:10px;padding:11px 13px}
small{color:var(--mute);font-size:12.5px}
.app{display:flex;height:100%;position:relative}
.side{width:300px;flex:none;background:var(--side);display:flex;flex-direction:column}
.brand{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;font:700 22px "Bricolage Grotesque",system-ui,sans-serif}
.side>input{margin:0 12px 8px}
.list{flex:1;overflow:auto;padding:0 8px}
.row{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.row:hover,.row.act{background:var(--hover)}
.ri{min-width:0;flex:1}
.ri b,.ri small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:700 16px "Bricolage Grotesque",system-ui,sans-serif;position:relative}
.av.on::after,.av.idle::after,.av.off::after{content:"";position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--side);background:var(--green)}
.av.idle::after{background:#f0b232}
.av.off::after{background:#80848e}
.bd{background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:1px 7px}
.tag{font-size:11px;background:var(--panel);color:var(--mute);padding:1px 6px;border-radius:6px;font-weight:500}
.me{display:flex;align-items:center;gap:6px;padding:10px;background:var(--panel)}
.mi{flex:1}
.mi b,.mi small,.hi b,.hi small{display:block}
button.off{color:var(--red);background:rgba(214,69,75,.15)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hover)}
header .av{--side:var(--bg)}
.hi{flex:1;min-width:0}
.hi b{font:700 17px "Bricolage Grotesque",system-ui,sans-serif}
.back{display:none}
.msgs{flex:1;overflow:auto;padding:8px 16px 16px}
.m{display:flex;gap:12px;margin-top:16px}
.m.c{margin-top:2px}
.gap{width:40px;flex:none}
.hd b{font-weight:600}
.hd small{margin-left:6px}
.t{word-break:break-word}
.empty{margin:40px auto;text-align:center;color:var(--mute);max-width:260px}
.typing{height:22px;padding:0 16px;font-size:12.5px;color:var(--mute)}
.compose{display:flex;gap:8px;padding:0 16px 16px}
.compose input{flex:1;min-width:0}
.compose button,.callbtn{background:var(--accent);color:var(--on);font-weight:600}
.compose button:hover,.callbtn:hover{background:var(--accent);filter:brightness(1.08)}
.call{position:absolute;inset:0;background:var(--panel);z-index:10;display:flex;flex-direction:column}
.call[hidden]{display:none}
.ch{text-align:center;padding:18px 16px 0}
.ch b{font:700 20px "Bricolage Grotesque",system-ui,sans-serif;display:block}
.tiles{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:16px;align-content:center}
.tile{background:var(--side);border-radius:16px;min-height:130px;display:grid;place-content:center;text-align:center;border:3px solid transparent;transition:border-color .15s}
.tile.talk{border-color:var(--green)}
.tile .av{width:64px;height:64px;font-size:26px;margin:0 auto 6px}
.tile.muted small::after{content:" (muted)"}
.ctl{display:flex;justify-content:center;gap:14px;padding:8px 16px 8px}
.ctl button{width:54px;height:54px;border-radius:50%;background:var(--side);font-size:20px}
.ctl button.off{background:rgba(214,69,75,.2)}
.ctl .end{background:var(--red);color:#fff}
.note{text-align:center;padding:0 16px 16px}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
#pav .av,#cav .av{width:96px;height:96px;font-size:36px}
textarea{resize:none;height:84px}
.call{overflow:auto}
.m .av,.hd b,#hav{cursor:pointer}
.dp{padding:9px;border-radius:12px}
.dp.sel{outline:2px solid var(--accent)}
.dp .av{width:34px;height:34px;font-size:14px}
.d-gold{box-shadow:0 0 0 3px #f5c542,0 0 12px 3px rgba(245,197,66,.55)}
.d-neon{box-shadow:0 0 0 3px #19e3ff,0 0 14px 4px rgba(25,227,255,.7)}
.d-rose{box-shadow:0 0 0 3px #ff6fa5,0 0 10px 2px rgba(255,111,165,.5)}
.d-ice{box-shadow:0 0 0 3px #bfe9ff,0 0 14px 4px rgba(150,215,255,.7)}
.d-aurora,.d-rainbow{isolation:isolate}
.d-aurora::before,.d-rainbow::before{content:"";position:absolute;inset:-5px;border-radius:50%;z-index:-1;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.d-aurora::before{background:conic-gradient(#2dd4bf,#818cf8,#f472b6,#2dd4bf)}
.d-rainbow::before{background:conic-gradient(#ff5f6d,#ffc371,#7bed9f,#4facfe,#c471f5,#ff5f6d);animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.d-crown::before,.d-sparkle::before{position:absolute;pointer-events:none;line-height:1;z-index:1}
.d-crown::before{content:"👑";top:-13px;left:50%;transform:translateX(-50%) rotate(-12deg);font-size:18px}
.d-sparkle::before{content:"✨";top:-8px;right:-8px;font-size:16px}
.inc{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:20;background:var(--panel);border:1px solid var(--hover);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25);width:max-content;max-width:94%}
.inc[hidden]{display:none}
.authbox{margin:auto;width:min(340px,92%);display:flex;flex-direction:column;gap:10px}
@media (max-width:700px){.side{width:100%}.app.chat .side,.app:not(.chat) .main{display:none}.back{display:inline-block}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.d-rainbow::before{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand">Talker <button id="newG" title="New group chat" aria-label="New group chat">＋</button></div>
    <input id="q" placeholder="Search chats" aria-label="Search chats">
    <div class="list" id="list"></div>
    <div class="me">
      <div id="myav"></div>
      <div class="mi"><b id="un"></b><small id="uh"></small></div>
      <button id="mic" title="Mute microphone" aria-label="Mute microphone">🎤</button>
      <button id="spk" title="Deafen" aria-label="Deafen">🎧</button>
      <button id="edit" title="Edit profile" aria-label="Edit profile">⚙</button>
      <button id="out" title="Log out" aria-label="Log out">⎋</button>
    </div>
  </aside>
  <section class="main">
    <header>
      <button class="back" id="back" aria-label="Back to chats">←</button>
      <div id="hav"></div>
      <div class="hi"><b id="hn"></b><small id="hs"></small></div>
      <button class="callbtn" id="call">📞 Call</button>
    </header>
    <div class="msgs" id="msgs"></div>
    <div class="typing" id="typ"></div>
    <div class="compose">
      <input id="in" autocomplete="off" aria-label="Message">
      <button id="send">Send</button>
    </div>
  </section>
  <div class="call" id="callUI" hidden>
    <div class="ch"><b id="cn"></b><small id="ct">Ringing…</small></div>
    <div class="tiles" id="tiles"></div>
    <div class="ctl">
      <button id="cm" title="Mute" aria-label="Mute">🎤</button>
      <button id="cs" title="Deafen" aria-label="Deafen">🎧</button>
      <button class="end" id="ce" title="Hang up" aria-label="Hang up">📞</button>
    </div>
    <div class="note"><small>Audio goes directly between browsers.</small></div>
  </div>
  <div class="inc" id="inc" hidden>
    <b id="rn"></b>
    <button class="callbtn" id="accept">Join</button>
    <button id="decline">Decline</button>
  </div>
  <div class="call" id="card" hidden>
    <div class="authbox" style="text-align:center">
      <div id="cav" style="align-self:center"></div>
      <div class="brand" id="cdn" style="padding:0;justify-content:center"></div>
      <small id="cun"></small>
      <div id="cbio" style="white-space:pre-wrap;word-break:break-word"></div>
      <button id="cclose">Close</button>
    </div>
  </div>
  <div class="call" id="prof" hidden>
    <div class="authbox">
      <div class="brand" style="padding:0">Edit profile</div>
      <div id="pav" style="align-self:center"></div>
      <label class="callbtn" style="text-align:center;padding:9px;border-radius:10px;cursor:pointer">Choose picture<input id="file" type="file" accept="image/*" hidden></label>
      <small style="text-align:center">Avatar decoration</small>
      <div id="dpick" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center"></div>
      <input id="pd" placeholder="Display name (optional)" aria-label="Display name" maxlength="32">
      <textarea id="pb" placeholder="Bio (optional)" aria-label="Bio" maxlength="190"></textarea>
      <input id="pn" placeholder="Username" aria-label="Username" maxlength="20">
      <button class="callbtn" id="psave">Save</button>
      <button id="pclose">Cancel</button>
      <small id="pe"></small>
    </div>
  </div>
  <div class="call" id="auth">
    <div class="authbox">
      <div class="brand" style="padding:0">Talker</div>
      <input id="em" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
      <input id="us" placeholder="Username (sign up only)" autocomplete="username" aria-label="Username">
      <button class="callbtn" id="login">Log in</button>
      <button id="signup">Create account</button>
      <small id="ae"></small>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://dmgzbhnixpmrshwuwawj.supabase.co",SUPABASE_KEY="sb_publishable_HdTaN-uCUg7Y2d0idefuYw_MzP5fS-N";
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col=n=>"hsl("+([...n].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360)+" 50% 42%)";
const pics={},decs={},disp={},bios={},DECS=["none","gold","neon","rose","aurora","rainbow","ice","crown","sparkle"];
const dn=n=>disp[n]||n;
const decCls=d=>d&&d!="none"&&DECS.includes(d)?" d-"+d:"";
const av=(n,cls="",d)=>{const u=pics[n],ok=u&&u.startsWith(SUPABASE_URL);return '<div class="av '+cls+decCls(d===undefined?decs[n]:d)+'" style="background:'+col(n)+'">'+(ok?'<img alt="" src="'+esc(u)+'">':esc(n[0]))+'</div>'};
const now=()=>new Date().toTimeString().slice(0,5);
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me,uname,D=[],cur,muted=false,deaf=false,names={},chans={},call=null,ring=null,pend=null,pdec="none";
const fmt=t=>new Date(t).toTimeString().slice(0,5);
const tup=m=>[names[m.user_id]||"Unknown",m.body,fmt(m.created_at),m.id];
function renderList(){
  const f=$("q").value.toLowerCase();
  $("list").innerHTML=D.filter(c=>(c.name+" "+dn(c.name)).toLowerCase().includes(f)).map(c=>{
    const l=c.msgs[c.msgs.length-1];
    const prev=l?(l[0]==uname?"You: ":(c.group?dn(l[0])+": ":""))+l[1]:"No messages yet";
    return '<div class="row'+(c===cur?" act":"")+'" data-id="'+c.id+'">'+av(c.name)+
      '<div class="ri"><b>'+esc(c.group?c.name:dn(c.name))+(c.group?' <span class="tag">group</span>':"")+'</b><small>'+esc(prev)+'</small></div>'+
      (c.unread?'<span class="bd">'+c.unread+'</span>':"")+'</div>';
  }).join("")||'<div class="empty">'+(D.length?"No chats match your search.":"No chats yet. Tap ＋ to start one.")+'</div>';
}
function renderMsgs(){
  let h="",p=null;
  cur.msgs.forEach(m=>{
    h+=p&&p[0]==m[0]
      ?'<div class="m c"><div class="gap"></div><div class="t">'+esc(m[1])+'</div></div>'
      :'<div class="m" data-u="'+esc(m[0])+'">'+av(m[0])+'<div><div class="hd"><b>'+esc(dn(m[0]))+'</b><small>'+m[2]+'</small></div><div class="t">'+esc(m[1])+'</div></div></div>';
    p=m;
  });
  $("msgs").innerHTML=h||'<div class="empty">No messages yet. Say hi to start the conversation.</div>';
  $("msgs").scrollTop=1e9;
}
function open(id){
  cur=D.find(c=>c.id==id);cur.unread=0;
  $("app").classList.add("chat");$("call").hidden=false;$("in").disabled=false;
  $("hav").innerHTML=av(cur.name);
  $("hn").textContent=cur.group?cur.name:dn(cur.name);
  $("hs").textContent=cur.group?cur.members.length+" members":"@"+cur.name;
  $("call").textContent=cur.group?"📞 Start group call":"📞 Call";
  $("in").placeholder="Message "+(cur.group?cur.name:dn(cur.name));
  $("typ").textContent="";
  renderMsgs();renderList();
}
function addMsg(m){
  const c=D.find(x=>x.id==m.conversation_id);
  if(!c||c.msgs.some(x=>x[3]==m.id))return;
  c.msgs.push(tup(m));
  if(c==cur)renderMsgs();else if(m.user_id!=me)c.unread++;
  renderList();
}
async function load(){
  const {data:ms,error}=await sb.from("members").select("conversation_id,user_id,profiles(username,avatar_url,decoration,display_name,bio),conversations(id,name,is_group)");
  if(error)return alert(error.message);
  const map={};
  ms.forEach(r=>{
    names[r.user_id]=r.profiles.username;pics[r.profiles.username]=r.profiles.avatar_url;decs[r.profiles.username]=r.profiles.decoration;disp[r.profiles.username]=r.profiles.display_name;bios[r.profiles.username]=r.profiles.bio;
    const c=map[r.conversation_id]||(map[r.conversation_id]={id:r.conversation_id,raw:r.conversations.name,group:r.conversations.is_group,members:[],msgs:[],unread:0});
    c.members.push({id:r.user_id,name:r.profiles.username});
  });
  D=Object.values(map);
  D.forEach(c=>c.name=c.raw||(c.group?c.members.map(m=>dn(m.name)).join(", "):(c.members.find(m=>m.id!=me)||c.members[0]).name));
  const {data:mm}=await sb.from("messages").select("*").order("created_at",{ascending:false}).limit(1000);
  (mm||[]).reverse().forEach(m=>{const c=D.find(x=>x.id==m.conversation_id);if(c)c.msgs.push(tup(m))});
  cur=cur&&D.find(c=>c.id==cur.id);D.forEach(wire);
  renderList();if(cur)renderMsgs();
}
function listen(){
  sb.channel("talker")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>addMsg(p.new))
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"members",filter:"user_id=eq."+me},()=>load())
    .subscribe();
}
async function send(){
  const t=$("in").value.trim();if(!t||!cur)return;
  $("in").value="";
  const {data,error}=await sb.from("messages").insert({conversation_id:cur.id,body:t}).select().single();
  if(error)return alert(error.message);
  addMsg(data);
}
function syncMute(){
  [$("mic"),$("cm")].forEach(b=>b.classList.toggle("off",muted));
  [$("spk"),$("cs")].forEach(b=>b.classList.toggle("off",deaf));
  const y=document.querySelector(".tile.me");if(y)y.classList.toggle("muted",muted);
  if(call){call.stream.getAudioTracks().forEach(t=>t.enabled=!muted);Object.values(call.aud).forEach(a=>a.muted=deaf)}
}
function wire(c){
  if(chans[c.id])return;
  chans[c.id]=sb.channel("call:"+c.id).on("broadcast",{event:"sig"},({payload:p})=>sig(c.id,p)).subscribe();
}
const tx=(cid,p)=>chans[cid].send({type:"broadcast",event:"sig",payload:Object.assign({from:me},p)});
function addTile(u){
  if(document.querySelector('.tile[data-u="'+u+'"]'))return;
  const n=names[u]||"Unknown";
  $("tiles").insertAdjacentHTML("beforeend",'<div class="tile'+(u==me?" me":"")+'" data-u="'+u+'">'+av(n)+'<b>'+esc(dn(n))+'</b><small>'+(u==me?"You":"Connecting…")+'</small></div>');
  syncMute();
}
const mark=(u,t)=>{const s=document.querySelector('.tile[data-u="'+u+'"] small');if(s)s.textContent=t};
function watch(s,u){
  try{
    call.ctx=call.ctx||new AudioContext();
    const an=call.ctx.createAnalyser();an.fftSize=256;
    call.ctx.createMediaStreamSource(s).connect(an);
    const d=new Uint8Array(an.frequencyBinCount);
    call.iv.push(setInterval(()=>{
      an.getByteTimeDomainData(d);let m=0;d.forEach(v=>m=Math.max(m,Math.abs(v-128)));
      const t=document.querySelector('.tile[data-u="'+u+'"]');if(t)t.classList.toggle("talk",m>12);
    },150));
  }catch(e){}
}
function mkpc(u){
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  pc._q=[];
  call.stream.getTracks().forEach(t=>pc.addTrack(t,call.stream));
  pc.onicecandidate=e=>e.candidate&&tx(call.cid,{t:"ice",to:u,c:e.candidate});
  pc.ontrack=e=>{
    let a=call.aud[u];if(!a){a=new Audio();a.autoplay=true;call.aud[u]=a}
    a.srcObject=e.streams[0];a.muted=deaf;watch(e.streams[0],u);
  };
  pc.onconnectionstatechange=()=>{
    if(!call||call.pcs[u]!==pc)return;
    if(pc.connectionState=="connected")mark(u,"Connected");
    if(pc.connectionState=="failed"||pc.connectionState=="closed")drop(u);
  };
  call.pcs[u]=pc;addTile(u);return pc;
}
function drop(u){
  if(!call)return;
  const pc=call.pcs[u];if(pc){delete call.pcs[u];pc.close()}
  if(call.aud[u]){call.aud[u].srcObject=null;delete call.aud[u]}
  const t=document.querySelector('.tile[data-u="'+u+'"]');if(t)t.remove();
}
const flushQ=pc=>{pc._q.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));pc._q=[]};
async function offerTo(u){
  if(call.pcs[u])drop(u);
  const pc=mkpc(u);
  await pc.setLocalDescription(await pc.createOffer());
  tx(call.cid,{t:"offer",to:u,sdp:pc.localDescription});
}
async function sig(cid,p){
  if(!p||p.from==me||(p.to&&p.to!=me)||!names[p.from])return;
  if(p.t=="ring"){
    if(call||ring)return;
    ring={cid,from:p.from};
    const c=D.find(x=>x.id==cid);
    $("rn").textContent=dn(names[p.from])+" is calling"+(c&&c.group?" "+c.name:"");
    $("inc").hidden=false;
    const r=ring;setTimeout(()=>{if(ring===r)hideRing()},30000);
  }else if(p.t=="leave"){
    if(ring&&ring.cid==cid&&ring.from==p.from)hideRing();
    if(call&&call.cid==cid)drop(p.from);
  }else if(!call||call.cid!=cid)return;
  else if(p.t=="join")offerTo(p.from);
  else if(p.t=="offer"){
    if(call.pcs[p.from])drop(p.from);
    const pc=mkpc(p.from);
    await pc.setRemoteDescription(p.sdp);flushQ(pc);
    await pc.setLocalDescription(await pc.createAnswer());
    tx(cid,{t:"answer",to:p.from,sdp:pc.localDescription});
  }else if(p.t=="answer"){
    const pc=call.pcs[p.from];if(!pc)return;
    await pc.setRemoteDescription(p.sdp);flushQ(pc);
  }else if(p.t=="ice"){
    const pc=call.pcs[p.from];if(!pc)return;
    pc.remoteDescription?pc.addIceCandidate(p.c).catch(()=>{}):pc._q.push(p.c);
  }
}
function hideRing(){ring=null;$("inc").hidden=true}
function accept(){const r=ring;hideRing();if(r)begin(r.cid,false)}
async function begin(cid,isNew){
  if(call)return;
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){return alert("Allow microphone access to make calls.")}
  call={cid,stream,pcs:{},aud:{},iv:[],ctx:null,t0:0};
  const cc=D.find(x=>x.id==cid);$("cn").textContent=cc.group?cc.name:dn(cc.name);
  $("tiles").innerHTML="";addTile(me);
  $("ct").textContent="Waiting for others…";
  $("callUI").hidden=false;watch(stream,me);
  call.iv.push(setInterval(()=>{
    const n=Object.values(call.pcs).filter(p=>p.connectionState=="connected").length;
    if(!n){call.t0=0;$("ct").textContent=Object.keys(call.pcs).length?"Connecting…":"Waiting for others…";return}
    call.t0=call.t0||Date.now();
    const s=Math.floor((Date.now()-call.t0)/1000);
    $("ct").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  },1000));
  tx(cid,{t:isNew?"ring":"join"});
}
function leave(){
  if(!call)return;
  tx(call.cid,{t:"leave"});
  Object.keys(call.pcs).forEach(drop);
  call.iv.forEach(clearInterval);
  call.stream.getTracks().forEach(t=>t.stop());
  if(call.ctx)call.ctx.close();
  call=null;$("callUI").hidden=true;
}
async function enter(u){
  me=u.id;
  const {data:p,error}=await sb.from("profiles").select("username,avatar_url,decoration,display_name,bio").eq("id",me).single();
  if(error)return $("ae").textContent=error.message;
  uname=p.username;names[me]=uname;pics[uname]=p.avatar_url;decs[uname]=p.decoration;disp[uname]=p.display_name;bios[uname]=p.bio;
  $("un").textContent=dn(uname);$("uh").textContent="@"+uname;$("myav").innerHTML=av(uname,"on");
  $("auth").hidden=true;
  await load();listen();
}
$("login").onclick=async()=>{
  const {data,error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error)return $("ae").textContent=error.message;
  enter(data.user);
};
$("signup").onclick=async()=>{
  const un=$("us").value.trim().toLowerCase();
  if(!/^[a-z0-9_]{3,20}$/.test(un))return $("ae").textContent="Username: 3 to 20 letters, numbers or underscores.";
  const {data,error}=await sb.auth.signUp({email:$("em").value.trim(),password:$("pw").value,options:{data:{username:un}}});
  if(error)return $("ae").textContent=error.message;
  if(!data.session)return $("ae").textContent="Check your email to confirm your account, then log in.";
  enter(data.user);
};
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("list").onclick=e=>{const r=e.target.closest(".row");if(r)open(r.dataset.id)};
$("q").oninput=renderList;
$("send").onclick=send;
$("in").onkeydown=e=>{if(e.key=="Enter")send()};
$("back").onclick=()=>$("app").classList.remove("chat");
$("call").onclick=()=>ring&&ring.cid==cur.id?accept():begin(cur.id,true);
$("ce").onclick=leave;
$("mic").onclick=$("cm").onclick=()=>{muted=!muted;syncMute()};
$("spk").onclick=$("cs").onclick=()=>{deaf=!deaf;syncMute()};
$("newG").onclick=async()=>{
  const u=prompt("Usernames to chat with (separate with commas)");if(!u)return;
  const list=u.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);if(!list.length)return;
  const nm=list.length>1?(prompt("Group name (optional)")||""):"";
  const {data,error}=await sb.rpc("create_chat",{p_name:nm,p_usernames:list});
  if(error)return alert(error.message);
  await load();open(data);
};
$("msgs").innerHTML='<div class="empty">Select a chat or start a new one with ＋.</div>';
$("call").hidden=true;$("in").disabled=true;
if(innerWidth<=700)$("app").classList.remove("chat");
function shrink(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=256,c=document.createElement("canvas");c.width=c.height=s;const k=Math.max(s/i.width,s/i.height),w=i.width*k,h=i.height*k;c.getContext("2d").drawImage(i,(s-w)/2,(s-h)/2,w,h);c.toBlob(b=>b?ok(b):no(new Error("Could not read image")),"image/jpeg",.85)};i.onerror=()=>no(new Error("Could not read image"));i.src=URL.createObjectURL(f)})}
function drawPick(){$("dpick").innerHTML=DECS.map(d=>'<button class="dp'+(d==pdec?" sel":"")+'" data-d="'+d+'" title="'+d+'" aria-label="'+d+'">'+av(uname,"",d)+'</button>').join("")}
$("dpick").onclick=e=>{const b=e.target.closest(".dp");if(!b)return;pdec=b.dataset.d;drawPick();const a=$("pav").querySelector(".av");if(a){DECS.forEach(x=>a.classList.remove("d-"+x));if(pdec!="none")a.classList.add("d-"+pdec)}};
$("edit").onclick=()=>{$("pn").value=uname;$("pd").value=disp[uname]||"";$("pb").value=bios[uname]||"";pdec=decs[uname]||"none";$("pav").innerHTML=av(uname,"",pdec);drawPick();pend=null;$("pe").textContent="";$("prof").hidden=false};
function card(u){
  $("cav").innerHTML=av(u);$("cdn").textContent=dn(u);$("cun").textContent="@"+u;
  $("cbio").textContent=bios[u]||"No bio yet.";$("card").hidden=false;
}
$("msgs").onclick=e=>{const m=e.target.closest(".m");if(m&&e.target.closest(".av,.hd b"))card(m.dataset.u)};
$("hav").onclick=()=>{if(cur&&!cur.group)card(cur.name)};
$("cclose").onclick=()=>$("card").hidden=true;
$("pclose").onclick=()=>$("prof").hidden=true;
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{pend=await shrink(f)}catch(x){return $("pe").textContent=x.message}
  $("pav").innerHTML='<div class="av'+decCls(pdec)+'" style="background:#555"><img alt="" src="'+URL.createObjectURL(pend)+'"></div>';
};
$("psave").onclick=async()=>{
  const un=$("pn").value.trim().toLowerCase();
  if(!/^[a-z0-9_]{3,20}$/.test(un))return $("pe").textContent="Username: 3 to 20 letters, numbers or underscores.";
  const upd={username:un,display_name:$("pd").value.trim()||null,bio:$("pb").value.trim()||null,decoration:pdec=="none"?null:pdec};
  try{
    if(pend){
      const path=me+".jpg";
      const r=await sb.storage.from("avatars").upload(path,pend,{upsert:true,contentType:"image/jpeg"});
      if(r.error)throw r.error;
      upd.avatar_url=sb.storage.from("avatars").getPublicUrl(path).data.publicUrl+"?v="+Date.now();
    }
    const r=await sb.from("profiles").update(upd).eq("id",me);
    if(r.error)throw r.error;
  }catch(e){return $("pe").textContent=e.code=="23505"?"That username is taken.":e.message}
  const old=uname;uname=un;names[me]=un;
  pics[un]=upd.avatar_url||pics[old];decs[un]=upd.decoration;disp[un]=upd.display_name;bios[un]=upd.bio;pend=null;
  $("un").textContent=dn(un);$("uh").textContent="@"+un;$("myav").innerHTML=av(un,"on");
  $("prof").hidden=true;await load();
};
$("accept").onclick=accept;
$("decline").onclick=hideRing;
addEventListener("pagehide",leave);
sb.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user)});
</script>
</body>
</html>
